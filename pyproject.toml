[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "replay-twice"
version = "0.2.0"
description = "Offline duplicate-delivery drills for agent tools and webhooks"
requires-python = ">=3.10"
dependencies = ["pytest>=7"]
license = "MIT"
authors = [{name = "Jigon Yoo"}]
readme = "README.md"

[project.entry-points.pytest11]
replay_twice = "replay_twice.plugin"

[project.scripts]
replay-twice = "replay_twice.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # tests run from a plain checkout, without installing
addopts = "-ra"
